[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vr-spatial-sound-exercises-backend"
version = "0.1.0"
description = "Prototype FastAPI backend for VR session control and results."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.0,<2.0.0",
    "fastapi>=0.136.0,<1.0.0",
    "pydantic-settings>=2.14.0,<3.0.0",
    "python-dotenv>=1.2.0,<2.0.0",
    "sqlalchemy>=2.0.49,<3.0.0",
    "uvicorn[standard]>=0.45.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=9.0.0,<10.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
